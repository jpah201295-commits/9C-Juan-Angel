<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('Fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .contenedor{
            width: 350px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        button{
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Menú Principal</h1>

    <button onclick="window.location.href='juego.html'">Juego</button>

    <button onclick="window.location.href='diario.html'">Diario</button>

    <button onclick="window.location.href='checklist.html'">Lista</button>

    <button onclick="window.location.href='Adicional.html'">Calculadora(Adicion)</button>

    <button onclick="window.location.href='Registro.html'">
        Volver al Registro
    </button>

</div>

</body>
</html>
