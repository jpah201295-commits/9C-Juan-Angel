<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dibujar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      padding: 24px;
    }

    h1 {
      text-align: center;
      color: #1f2937;
      margin-bottom: 16px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .palette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .color {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .color:hover {
      transform: scale(1.15);
    }

    .color.active {
      border: 3px solid #1f2937;
      transform: scale(1.15);
    }

    .custom-color {
      width: 34px;
      height: 34px;
      border: 2px solid #d1d5db;
      border-radius: 50%;
      background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
      cursor: pointer;
    }

    .canvas-wrap {
      position: relative;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    canvas {
      display: block;
      width: 100%;
      height: 480px;
      cursor: crosshair;
      touch-action: none;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button, .custom-color {
      padding: 10px 16px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    .save-btn {
      background: #16a34a;
      color: #fff;
      font-weight: bold;
    }

    .clear-btn {
      background: #dc2626;
      color: #fff;
    }

    .eraser-btn {
      background: #6b7280;
      color: #fff;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #1f2937;
    }

    input[type="range"] {
      width: 90px;
    }

    .back-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: #6b7280;
      color: #fff;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dibujar</h1>

    <div class="toolbar">
      <div class="palette" id="palette"></div>
      <button class="custom-color" id="custom-color" title="Elegir color personalizado"></button>
      <input type="color" id="color-picker" style="display: none;">
      <button class="eraser-btn" id="eraser-btn">Borrador</button>
      <label>Tamaño: <input type="range" id="brush-size" min="1" max="40" value="5"></label>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas" width="676" height="480"></canvas>
    </div>

    <div class="actions">
      <button class="save-btn" id="save-btn">Guardar dibujo</button>
      <button class="clear-btn" id="clear-btn">Limpiar</button>
    </div>

    <a href="menu.html" class="back-btn">Volver al menú</a>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const palette = document.getElementById('palette');
    const customColorBtn = document.getElementById('custom-color');
    const colorPicker = document.getElementById('color-picker');
    const eraserBtn = document.getElementById('eraser-btn');
    const brushSizeInput = document.getElementById('brush-size');
    const saveBtn = document.getElementById('save-btn');
    const clearBtn = document.getElementById('clear-btn');

    const colors = ['#000000', '#ffffff', '#dc2626', '#f59e0b', '#facc15', '#16a34a', '#2563eb', '#7c3aed', '#ec4899', '#92400e', '#9ca3af'];

    let currentColor = '#000000';
    let isEraser = false;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    function buildPalette() {
      colors.forEach((color) => {
        const btn = document.createElement('div');
        btn.className = 'color' + (color === currentColor ? ' active' : '');
        btn.style.background = color;
        btn.addEventListener('click', () => {
          currentColor = color;
          isEraser = false;
          updatePalette();
        });
        palette.appendChild(btn);
      });
    }

    function updatePalette() {
      palette.querySelectorAll('.color').forEach((btn, index) => {
        btn.classList.toggle('active', colors[index] === currentColor);
      });
      eraserBtn.textContent = isEraser ? 'Borrador (activo)' : 'Borrador';
    }

    customColorBtn.addEventListener('click', () => colorPicker.click());
    colorPicker.addEventListener('input', () => {
      currentColor = colorPicker.value;
      isEraser = false;
      updatePalette();
    });

    eraserBtn.addEventListener('click', () => {
      isEraser = !isEraser;
      updatePalette();
    });

    function getPos(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const point = event.touches ? event.touches[0] : event;
      return {
        x: (point.clientX - rect.left) * scaleX,
        y: (point.clientY - rect.top) * scaleY
      };
    }

    function drawLine(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineWidth = brushSizeInput.value;
      ctx.lineCap = 'round';
      ctx.strokeStyle = isEraser ? '#ffffff' : currentColor;
      ctx.stroke();
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const pos = getPos(e);
      lastX = pos.x;
      lastY = pos.y;
      drawLine(lastX, lastY, lastX + 0.1, lastY + 0.1);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const pos = getPos(e);
      drawLine(lastX, lastY, pos.x, pos.y);
      lastX = pos.x;
      lastY = pos.y;
    });

    canvas.addEventListener('mouseup', () => { isDrawing = false; });
    canvas.addEventListener('mouseleave', () => { isDrawing = false; });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDrawing = true;
      const pos = getPos(e);
      lastX = pos.x;
      lastY = pos.y;
      drawLine(lastX, lastY, lastX + 0.1, lastY + 0.1);
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!isDrawing) return;
      const pos = getPos(e);
      drawLine(lastX, lastY, pos.x, pos.y);
      lastX = pos.x;
      lastY = pos.y;
    });

    canvas.addEventListener('touchend', () => { isDrawing = false; });

    saveBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'dibujo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    buildPalette();
    updatePalette();
  </script>
</body>
</html>
