<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist de Tareas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 520px;
      padding: 28px;
    }

    h1 {
      text-align: center;
      color: #1f2937;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #task-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    #task-input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    #add-btn {
      padding: 10px 18px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
    }

    #task-list {
      list-style: none;
    }

    #task-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    #task-list li:last-child {
      border-bottom: none;
    }

    #task-list li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #16a34a;
    }

    #task-list li span {
      flex: 1;
      color: #1f2937;
      word-break: break-word;
    }

    #task-list li span.done {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .delete-btn {
      padding: 6px 12px;
      background: #dc2626;
      color: #fff;
      font-size: 13px;
    }

    #empty-msg {
      text-align: center;
      color: #9ca3af;
      padding: 20px 0;
    }

    .back-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      background: #6b7280;
      color: #fff;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Checklist de Tareas</h1>
    <div class="input-row">
      <input type="text" id="task-input" placeholder="Escribe una nueva tarea..." autofocus>
      <button id="add-btn">Añadir</button>
    </div>
    <ul id="task-list"></ul>
    <p id="empty-msg">No hay tareas todavía.</p>
    <a href="menu.html" class="back-btn">Volver al menú</a>
  </div>

  <script>
    const taskInput = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('task-list');
    const emptyMsg = document.getElementById('empty-msg');

    function loadTasks() {
      const saved = localStorage.getItem('tasks');
      return saved ? JSON.parse(saved) : [];
    }

    function saveTasks(tasks) {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      const tasks = loadTasks();
      taskList.innerHTML = '';
      emptyMsg.style.display = tasks.length ? 'none' : 'block';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', () => {
          tasks[index].done = checkbox.checked;
          saveTasks(tasks);
          renderTasks();
        });

        const span = document.createElement('span');
        span.textContent = task.text;
        if (task.done) {
          span.classList.add('done');
        }

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = 'Eliminar';
        deleteBtn.addEventListener('click', () => {
          tasks.splice(index, 1);
          saveTasks(tasks);
          renderTasks();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      });
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) {
        return;
      }
      const tasks = loadTasks();
      tasks.push({ text, done: false });
      saveTasks(tasks);
      taskInput.value = '';
      taskInput.focus();
      renderTasks();
    }

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        addTask();
      }
    });

    renderTasks();
  </script>
</body>
</html>
